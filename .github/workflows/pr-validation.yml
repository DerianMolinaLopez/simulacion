name: pr-validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar y probar
        run: mvn -B -ntp verify

  version-check:
    name: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validar versionamiento del pom.xml
        run: bash .github/scripts/check-version.sh "${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
